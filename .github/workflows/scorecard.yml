name: OpenSSF Scorecard

# Scores this repository against the OpenSSF supply-chain checks — pinned
# dependencies, branch protection, token permissions, dangerous workflow patterns,
# signed releases, vulnerability response.
#
# It exists here for one reason beyond the badge: it is the only check in this
# pipeline that fails when something OUTSIDE the files degrades. Branch protection
# being switched off, a token gaining write scope, a release losing provenance —
# none of that shows up in a diff, so nothing else here would notice.
#
# Results are uploaded to the Security tab as SARIF. Nothing fails the build on a
# score: the value is the trend, and a hard threshold on a composite score is the
# kind of gate that gets bypassed rather than fixed.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 9 * * 1" # weekly — Mondays 09:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

# The Scorecard docs show `read-all` here. Named explicitly instead: the job below
# grants itself exactly what it needs, so a blanket read at the top only widens the
# default for anything added later without anyone re-reading this line.
permissions:
  contents: read # Read the repository OpenSSF Scorecard grades.

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # Upload the SARIF result to code scanning.
      actions: read # Read the workflow run history the dangerous-workflow checks reason about.
      contents: read # Read the repository OpenSSF Scorecard grades.
      id-token: write # Mint the OIDC token that publishes the result to the public dashboard.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing makes the score readable by anyone evaluating whether to
          # depend on @theokit/* — which is the point of running it on a library.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: results.sarif
