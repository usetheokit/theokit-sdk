name: Release

# Per technical-hardening-sprint plan v1.1 T1.1 (NEW) + ADR D1:
# theokit-sdk ships the Harness package set (sdk + sdk-* extensions + memory
# adapters + acp + cli + codemod) — changesets/action pattern is the right
# vehicle for multi-package per-package release notes + sequential publish.
# (Backend-DX, gateways, react, rag, voice, google-workspace skill were
# extracted to sibling repos — plan monorepo-cohesion-split, 2026-06-18.)
# Auth is OIDC. No NODE_AUTH_TOKEN, no NPM_TOKEN: each of the twelve packages
# carries a Trusted Publisher connection on npmjs.com naming this repository and
# this file, and npm mints a short-lived credential per job. Provenance is
# declared per package via `publishConfig.provenance: true`, not by an env var.
# The publish step below carries the full rationale.
#
# This header has now been wrong in BOTH directions, which is why it is worth the
# space. It first claimed NPM_TOKEN was unused while the step used it — the worst
# thing to read while debugging the expired-token E404s of 2026-07-24 and
# 2026-08-11. It was corrected to describe the token, and then the step moved to
# OIDC and left the header describing the token again (#370): the fix was real,
# the description of it was not, and a reader checking the header would have
# concluded provenance was still impossible here.
#
# Keep this block and the publish step in agreement, or delete this one. A header
# that disagrees with the code it summarizes is worse than no header, and this
# file has proved that twice.
#
# This file also carries the SNAPSHOT path, reachable only from a manual dispatch
# that supplies a dist-tag. It lives HERE rather than in a workflow of its own because
# each of the twelve Trusted Publisher connections on npmjs.com names this repository
# AND this file: a second workflow would need twelve new connections, created by hand
# through the npm UI. The snapshot step below states what it costs.
#
# RELATED, as of the pipeline standardisation: usetheokit/theokit#169 was that
# repository's release.yml failing with EUNKNOWNCONFIG (--git-checks) from an
# `npm install -g npm@latest` step. This workflow now installs npm too — pinned to
# 11.9.0, which is exactly the version that clears the OIDC floor without crossing
# into the npm 12 behaviour that caused #169. See the step for the measurements.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot:
        description: >-
          Publish a SNAPSHOT under this dist-tag instead of cutting a release
          (for example "pr-479"). Leave empty for the ordinary release path.
        required: false
        default: ''

# Written in map form only to state the second line. The scalar form defaults to
# `cancel-in-progress: false`, which is already what a release needs -- but the default is silent,
# and a linter that cannot tell "chose false" from "never considered it" flags it on every audit.
#
# `false` is the whole point, and it is the opposite of a CI leg. Cancelling a superseded CI run
# discards a verdict nobody will read. Cancelling a superseded RELEASE run discards a half-finished
# publish: versions bumped and committed but not published, or published with no tag and no release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The last line, for the path that reached a release without passing through a pull request.
  # If the declared channel and `.changeset/pre.json` disagree, this release would publish under
  # the wrong dist-tag — most expensively, a stable version onto `latest` after an accidental
  # `changeset pre exit`, with the publish reporting success.
  release-channel:
    name: release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: usetheokit/shared-workflows/actions/release-channel@v1 # zizmor: ignore[unpinned-uses]

  release:
    needs: release-channel
    name: Release via Changesets (Harness)
    # The environment exists for its DEPLOYMENT BRANCH POLICY, which is restricted to `main`.
    #
    # That is not decoration. This workflow carries `workflow_dispatch`, so before the policy
    # existed anyone with write access could dispatch it from an arbitrary branch and the job
    # would mint a release App token there. The policy makes the job unrunnable outside `main`,
    # which is the only branch a release may be cut from anyway.
    #
    # NO reviewer gate: a solo-maintainer repository cannot satisfy an approval gate, and a gate
    # only its author can bypass teaches bypassing. The environment carries one rule.
    #
    # The App credentials stay ORGANIZATION secrets rather than moving in here: an org secret
    # cannot be scoped to a repository environment, and their values are write-only, so nothing
    # could copy them. The protection bought is the branch policy, not secret isolation -- said
    # plainly because `environment:` is easy to mistake for the second.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Mint a short-lived token from the `theokit-release` GitHub App. GitHub does not start
      # workflow runs from GITHUB_TOKEN-authored events, so a Version Packages pull request
      # opened with that token arrives with none of its required checks running, and a
      # required check that never reports cannot be satisfied. An App-authored event does
      # start them. Proven on theokit-ui: 0/3 required checks became 3/3, the pull request
      # reached CLEAN by itself, and 1.10.1 published with no manual gesture.
      #
      # The token is minted per run and expires with it. What is long-lived is the App's
      # private key, an organization secret scoped to three repository permissions. NOT used
      # for npm — the twelve packages still publish over OIDC with no token at all.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the token to what this job does rather than inheriting whatever the
          # installation holds. zizmor flags the unrestricted form as high severity.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          # This is the ONE checkout in the repository that keeps its credential,
          # and it is not an oversight. changesets/action v1 pushes the version
          # commit and the release tags with the git CLI, taking its authentication
          # from exactly this persisted credential — `persist-credentials: false`
          # here makes the push fail AFTER the packages are already on npm, which
          # is the worst possible place for this job to break.
          #
          # It must be the APP's token. The push of `changeset-release/main` is what the
          # pull request is opened against, so a push carrying the Actions bot's credential
          # produces a bot-authored branch and the checks stay dormant even though the pull
          # request was opened by the App. Both halves have to be the App or neither is.
          token: ${{ steps.app-token.outputs.token }}
          #
          # zizmor reports this as `artipacked` (low confidence). Accepted, with the
          # scope kept small: the job holds `contents: write` because releasing
          # requires it, and every other checkout in this repository sets
          # `persist-credentials: false`.
          #
          # It stops being necessary when the CLI moves to 3.x and the action to v2,
          # which pushes through the GitHub API instead. See the pin note below.

      # `@v1` is a moving ref by design — a policy fix in shared-workflows must reach every
      # caller without nine pull requests, which is the reason that repository exists. What the
      # action RUNS stays pinned: every action inside it by digest, Node from `.nvmrc`, and pnpm
      # from `packageManager`, so neither version is named twice.
      #
      # It carries the cache key this block spelled out — `package.json` beside `pnpm-lock.yaml`,
      # because setup-node keys the pnpm store on the lockfile alone, so a pnpm 9 → 10 bump would
      # leave the key identical and restore a store the new pnpm reads as inconsistent
      # (`ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`).
      #
      # It also deliberately does NOT pass `registry-url`, which is the property this file needs
      # most: setup-node would write `_authToken=${NODE_AUTH_TOKEN}` into an npmrc unconditionally
      # and nothing exports that token under OIDC, so the publish would run against a config
      # naming a credential that does not exist.
      #
      # `install: false` — the frozen install stays where it is below, AFTER the npm upgrade,
      # because the order is load-bearing and this change is about the toolchain block only.
      - uses: usetheokit/shared-workflows/actions/setup@v1 # zizmor: ignore[unpinned-uses]
        with:
          install: 'false'
          # NO `registry-url`. It looks harmless and is not: setup-node writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an npmrc
          # UNCONDITIONALLY and points NPM_CONFIG_USERCONFIG at it, then exports
          # NODE_AUTH_TOKEN only if the caller supplied one — which, under OIDC,
          # nobody does. The job would publish with a config declaring a credential
          # that does not exist. registry.npmjs.org is already the default, and
          # `publishConfig.access: public` in each manifest covers the scope.

      # THE STEP WITHOUT WHICH THE OIDC CONFIGURATION IS CORRECT AND USELESS.
      # setup-node ships whatever npm the Node release bundles, and Node 22 bundles
      # npm 10.9.7. OIDC needs npm >= 11.5.1: an older npm does not know what to do
      # with `id-token: write`, looks for a credential, finds none, and the registry
      # answers `E404 Not Found - PUT` — which is exactly the error this workflow
      # hit twice on an expired token, and both releases were then completed by hand
      # from a developer machine.
      #
      # Pinned exactly, and NOT to 12.x. npm 12 breaks this path in two places:
      #   1. It rejects the `--no-git-checks` flag changesets passes through, with
      #      EUNKNOWNCONFIG, where every earlier npm ignored it.
      #   2. It returns an ARRAY from `npm info --json` where earlier npm returned an
      #      object. changesets reads `response.pkgInfo.versions || []`; on an array
      #      that is `undefined`, so every package looks unpublished and it tries to
      #      publish all twelve. Nothing errors — it just republishes.
      # 11.9.0 is the newest npm that clears the OIDC floor and avoids both.
      # Measured in theokit-di; see that repository's release.yml for the numbers.
      - name: Install an npm that speaks OIDC (>= 11.5.1) but tolerates the publish flags
        uses: usetheokit/shared-workflows/actions/npm-oidc@v1 # zizmor: ignore[unpinned-uses]

      - run: pnpm install --frozen-lockfile

      # ── The publish gate ───────────────────────────────────────────────────
      #
      # Until 2026-08-17 this workflow went straight from install to publish. It
      # ran no tests, and it did not wait for CI: both fire on the same push to
      # `main` and race. Measured on this repository — Release finishes in 77-79s,
      # CI in 346-378s — so the publish completed roughly five minutes before CI
      # had a verdict. On 2026-08-17 a push produced `CI failure 372s` alongside
      # `Release success 79s`; that release only did no damage because no changeset
      # was pending. With one queued, a red build would have shipped to npm, where
      # a version cannot be unpublished after 72 hours.
      #
      # Branch protection on `main` is the primary gate and keeps a red commit from
      # landing at all. This is the second one, and the stronger of the two: it
      # validates the exact tree being published, in the same job that publishes it,
      # rather than trusting a verdict from a separate run on a separate checkout.
      #
      # Releases are rare (23 to date), so paying CI's ~6 minutes again here costs
      # far less than one bad publish.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"

      # Without bwrap the kernel-confinement tests SKIP, and a skipped test reports
      # green. Omitting this step would make the release gate quietly weaker than
      # CI on exactly the tests that prove sandbox isolation is real.
      - name: Install bubblewrap + enable unprivileged userns (kernel-confinement tests)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true && echo "bwrap OK: userns liberado"

      - name: Full quality gate (nothing publishes untested)
        run: pnpm validate

      # `changesets/action` COMMITS inside this job — the "Version Packages" bump —
      # which fires the repository's pre-commit hook, and that hook's secret gate is
      # fail-closed: no `trufflehog` on PATH means it aborts rather than waving the
      # commit through. Measured on run 32038684001, where the release died here with
      # "Secret scanning gate cannot run: `trufflehog` is not on PATH" after the whole
      # quality gate had already passed.
      #
      # Installing the binary rather than teaching the hook to skip in CI: a gate that
      # disables itself where it is inconvenient is how a gate stops being one, and the
      # release job is the last place to start making exceptions.
      #
      # Pinned to the same version .github/workflows/secret-scan.yml runs, so the local
      # hook and the push-side workflow cannot drift into disagreeing about a finding.
      - name: Install TruffleHog (the pre-commit hook's secret gate needs it on PATH)
        env:
          TRUFFLEHOG_VERSION: v3.97.0
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/trufflesecurity/trufflehog/releases/download/${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION#v}_linux_amd64.tar.gz" \
            | tar xz -C /tmp trufflehog
          install -m 0755 /tmp/trufflehog "$HOME/.local/bin/trufflehog"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trufflehog" --version

      - name: Create Release Pull Request or Publish
        id: changesets
        # A dispatch carrying a snapshot tag takes the step below instead. A push to
        # `main` never supplies one, so the ordinary path is unchanged by construction.
        if: github.event_name == 'push' || inputs.snapshot == ''
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          # `pnpm release` rather than `changeset publish` directly, so the workspace-protocol
          # guard (B-111) runs BEFORE the publish. Calling `changeset publish` here skipped it,
          # leaving that guard on the local path only — the path releases do NOT normally take.
          #
          # The ref verification (B-114) is NOT here. `changeset publish` creates the tags; this
          # ACTION pushes them, in a step of its own after the publish returns. Verifying inside
          # `publish:` therefore checked before the pusher ran and failed every release — measured
          # on 4.45.0, where the tag it reported missing was on the remote moments later. A gate
          # that fails every time is a gate people learn to ignore, so it moved to its own step
          # below.
          #
          # PINNED TO v1.9.0, deliberately not v2. The action is now version-locked to the
          # Changesets CLI: v2 aborts on startup with "designed to work with Changesets CLI v3.
          # Changesets CLI v2 is not supported" — measured here on 2026-08-17, run 32019128529,
          # after the quality gate had already passed. This repository is on
          # `@changesets/cli@^2.31.0`, so v1 is the correct major, and the SHA pin is what the
          # supply-chain finding actually asked for.
          #
          # Moving to action v2 means first migrating the CLI to 3.x across twelve published
          # packages. That is a release-tooling migration with its own blast radius and belongs in
          # its own change, not bundled into a pipeline hardening commit.
          # Renamed by changesets/action v2. The action refuses the v1 names outright —
          # "Error: The following inputs have been renamed" — so the release failed at this step
          # with everything before it green. Measured on the first release after #375 bumped the
          # action; nothing was published, because the failure is at the action rather than inside
          # it. A pull request cannot catch this: release.yml only runs on a push to `main`.
          publish-script: pnpm release
          version-script: pnpm changeset version
          # v2 takes the token as an INPUT, and refuses to run when GITHUB_TOKEN is also set in
          # the environment and differs: "The GITHUB_TOKEN environment variable is set and does
          # not match the github-token input." The App's token is still the one that matters —
          # it is what makes the Version Packages pull request run its required checks — so it
          # moves here rather than being dropped. Measured on the release after #512.
          github-token: ${{ steps.app-token.outputs.token }}
        # THE ONE ENVIRONMENT VARIABLE THIS STEP SETS, and it is not an npm credential.
        #
        # `.changeset/config.json` uses `@changesets/changelog-github`, which turns each entry
        # into a PR link, a commit link and an author attribution instead of a bare hash. It
        # reaches the GitHub GraphQL API and reads `GITHUB_TOKEN` from the ENVIRONMENT — an input
        # cannot reach it, because `version-script` runs it in a child process.
        #
        # EVERY failure path in that package throws: missing token, network error, GraphQL
        # `errors`, or a response with no `data` (`get-github-info/src/dataloader.ts`). There is no
        # degraded mode, so an absent variable does not produce a plainer changelog — it fails
        # `changeset version` and the release stops with nothing published.
        #
        # It is the SAME token as the `github-token` input above, and that is load-bearing rather
        # than tidy. `changesets/action` v2 throws when `process.env.GITHUB_TOKEN` is set AND
        # differs from the input (`src/index.ts:35`). Equal passes; a second token would break the
        # step before it starts.
        #
        # WHY NO npm CREDENTIAL IS HERE, unchanged by the above:
        # AUTHENTICATION IS OIDC, NOT A TOKEN. Each of the twelve packages carries a Trusted
        # Publisher connection on npmjs.com naming this repository and THIS FILE. npm mints a
        # short-lived credential for the individual job, scoped to that package; it cannot be
        # exported or replayed, and it cannot expire between releases.
        #
        # That last property is the reason. This publish step failed twice on an expired
        # NPM_TOKEN (E404 on PUT, 2026-07-24 and 2026-08-11) and both releases were finished by
        # hand from a laptop. A credential that does not exist cannot expire.
        #
        # NPM_TOKEN is not merely unnecessary here — it is harmful. The npm CLI prefers token auth
        # over the OIDC token from `id-token: write`, so setting it silently disables the
        # trusted-publisher binding and takes provenance with it.
        #
        # NPM_CONFIG_PROVENANCE is gone for the same reason it left the other repositories:
        # `publishConfig.provenance: true` now sits in all twelve manifests, so provenance is
        # declared beside the package it describes.
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # ── The snapshot path ──────────────────────────────────────────────────
      #
      # A fix in this repository becomes verifiable by a consumer only once it is ON THE
      # REGISTRY. theokit-examples installs every example from npm at a pinned version, on
      # purpose: an example that resolves through a workspace tests the repository it lives
      # in, not the experience of the person who typed `npm install`. That promise is what
      # makes every fix wait for the next release cut.
      #
      # A snapshot keeps the promise and drops the wait. `changeset version --snapshot`
      # derives a prerelease version from the pending changesets, and `changeset publish
      # --tag` puts it on a dist-tag that is NOT `latest`. It IS the registry, resolved like
      # any other install — nobody reaches it by asking for `latest`.
      #
      # WHAT IT COSTS, stated rather than discovered: an npm version is immutable and cannot
      # be unpublished after 72 hours. Every snapshot burns one, permanently. That is the
      # price of being the registry instead of a rehearsal of it.
      #
      # It leaves NO trace in this repository. `commit: false` in .changeset/config.json keeps
      # the version bump in the working tree, `--no-git-tag` keeps it out of the ref namespace,
      # and nothing in this step pushes.
      #
      # The quality gate above runs on this path too. A snapshot is a real publish under a
      # real package name, so "nothing publishes untested" is not a claim the tag suspends.
      # ── The snapshot path ──────────────────────────────────────────────────
      #
      # A fix here becomes verifiable by a consumer only once it is ON THE REGISTRY:
      # theokit-examples installs every example from npm at a pinned version, on purpose, because
      # an example that resolves through a workspace tests the repository it lives in rather than
      # the experience of the person who typed `npm install`. That promise made every fix wait for
      # the next release cut. A snapshot keeps the promise and drops the wait.
      #
      # The implementation moved to shared-workflows on 2026-09-01 and is no longer inline. It was
      # the only copy in the ecosystem, and it had stopped working the day prerelease mode was
      # switched on here: `changeset version --snapshot` refuses outright in pre mode, in a path
      # nobody runs on a schedule, so nothing reported it. Copying it into six more repositories
      # would have copied that with it — which is the argument shared-workflows exists to make.
      #
      # `release:snapshot` is passed rather than the default publish command so this path keeps
      # going through `prepublish:guards`. A guard added to the release path and missing from this
      # one is a failure this repository has already paid for more than once.
      - name: Publish a snapshot (never on `latest`)
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot != ''
        uses: usetheokit/shared-workflows/actions/snapshot@v1 # zizmor: ignore[unpinned-uses]
        with:
          tag: ${{ inputs.snapshot }}
          publish-command: pnpm run release:snapshot
        # This path runs `changeset version --snapshot`, and adopting
        # `@changesets/changelog-github` made THAT command reach the GitHub API to resolve a commit
        # to its pull request. The release path was given the token in the same change; this one was
        # not, because nothing here says the two are coupled. Measured on the first snapshot after
        # the switch:
        #
        #   The following error was encountered while generating changelog entries
        #   We have escaped applying the changesets, and no files should have been affected
        #   Error: Please create a GitHub personal access token … as the GITHUB_TOKEN
        #
        # It failed CLOSED — nothing published, nothing was written — which is the only reason this
        # is a wasted run rather than a half-versioned tree.
        #
        # Unlike the `changesets/action` step above, there is no conflict to avoid here: that action
        # throws when `GITHUB_TOKEN` is set in the environment AND differs from its `github-token`
        # input. This is a composite action running `pnpm` directly, so it takes no such input and
        # the environment is the only channel.
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: verify release refs reached the remote
        if: steps.changesets.outputs.published == 'true'
        run: node tools/verify-release-refs.mjs

      # #388 — the OTHER outcome. With changesets pending the action opens a "Version Packages"
      # pull request instead of publishing, and reports success: success meaning it PREPARED a
      # version, not that it shipped one. Every workflow on that pull request landed in
      # `action_required` — created, never run, waiting on a human nobody knew to be waiting for —
      # so `main`'s required checks could not pass and the release sat blocked for eight days while
      # this run stayed green.
      #
      # The gate does not unblock the release; that is a repository-configuration decision (see the
      # script's failure message for the three options). It makes the stuck state say so, here,
      # where a maintainer is already looking, instead of only in `npm view @theokit/sdk version`.
      - name: verify the version pull request can actually be merged
        # A snapshot run opens no version pull request, so `published` is empty there and
        # the bare `!= 'true'` would send this looking for a pull request that was never
        # meant to exist. The snapshot clause is what keeps it asking about the release path.
        if: (github.event_name == 'push' || inputs.snapshot == '') && steps.changesets.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/verify-release-reachable.mjs
